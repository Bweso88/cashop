# Environnement de développement local Cashop.
#   Phase 1 : seules les dépendances sont démarrables  -> docker compose up -d postgres redis mailpit
#   Phases suivantes : profils "backend", "web", "admin" -> docker compose --profile backend up
name: cashop

x-backend: &backend
  build:
    context: .
    dockerfile: infra/docker/php/Dockerfile
    target: dev
  env_file: .env
  volumes:
    - ./backend:/var/www/html
  depends_on:
    postgres: { condition: service_healthy }
    redis: { condition: service_healthy }
  networks: [cashop]
  profiles: [backend]

services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: ${DB_DATABASE:-cashop}
      POSTGRES_USER: ${DB_USERNAME:-cashop}
      POSTGRES_PASSWORD: ${DB_PASSWORD:?Définir DB_PASSWORD dans .env}
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./infra/postgres/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    ports: ["5432:5432"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USERNAME:-cashop}"]
      interval: 5s
      retries: 10
    networks: [cashop]

  redis:
    image: redis:7-alpine
    command: ["redis-server", "--appendonly", "yes"]
    volumes: [redisdata:/data]
    ports: ["6379:6379"]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      retries: 10
    networks: [cashop]

  mailpit:
    image: axllent/mailpit:latest
    ports: ["8025:8025"]
    networks: [cashop]

  # ─── Backend Laravel ──────────────────────────────────────────────────────
  api:
    <<: *backend

  queue:
    <<: *backend
    command: ["php", "artisan", "horizon"]

  scheduler:
    <<: *backend
    command: ["php", "artisan", "schedule:work"]

  nginx:
    image: nginx:1.27-alpine
    volumes:
      - ./infra/nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
      - ./backend/public:/var/www/html/public:ro
    ports: ["8080:80"]
    depends_on: [api]
    networks: [cashop]
    profiles: [backend]

  # ─── Front-ends Next.js (deux applications séparées) ─────────────────────
  web:
    build:
      context: .
      dockerfile: infra/docker/node/Dockerfile
      target: dev
      args: { APP_DIR: web }
    environment:
      NEXT_PUBLIC_APP_URL: ${WEB_URL:-http://localhost:3000}
      CASHOP_API_URL: http://nginx
    volumes: ["./web:/app", "/app/node_modules", "/app/.next"]
    ports: ["3000:3000"]
    networks: [cashop]
    profiles: [web]

  admin:
    build:
      context: .
      dockerfile: infra/docker/node/Dockerfile
      target: dev
      args: { APP_DIR: admin }
    environment:
      NEXT_PUBLIC_APP_URL: ${ADMIN_URL:-http://localhost:3001}
      CASHOP_API_URL: http://nginx
    volumes: ["./admin:/app", "/app/node_modules", "/app/.next"]
    ports: ["3001:3000"]
    networks: [cashop]
    profiles: [admin]

volumes:
  pgdata:
  redisdata:

networks:
  cashop:
