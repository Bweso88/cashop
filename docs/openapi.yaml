openapi: 3.1.0
info:
  title: Cashop API
  version: 0.3.0
  summary: API REST de la plateforme de transferts Cashop (mobile et web).
  license:
    name: Propriétaire — tous droits réservés
    identifier: LicenseRef-Proprietary
  description: |
    Spécification **v0** (phase 1). Les montants sont des entiers en **unités mineures** ISO 4217
    (XAF : 0 décimale ; EUR, USD, GBP : 2 décimales).

    - Toutes les opérations financières exigent l'en-tête `Idempotency-Key`.
    - Chaque réponse renvoie `X-Correlation-Id` (généré s'il n'est pas fourni).
    - Aucun appel ne parle directement à un provider externe : l'orchestrateur Cashop s'en charge.
servers:
  - url: http://localhost:8080/api/v1
    description: Développement local
tags:
  - name: Auth
    description: "Inscription, connexion, OTP, PIN"
  - name: Profile
    description: "Profil utilisateur"
  - name: Catalog
    description: "Portefeuilles de paiement, réseaux, corridors, scénarios de simulation"
  - name: Transfers
    description: "Quotes et transferts"
  - name: Beneficiaries
    description: "Bénéficiaires enregistrés"
  - name: KYC
    description: "Vérification d'identité"
  - name: Providers
    description: "Providers disponibles et capacités"
  - name: Webhooks
    description: "Notifications entrantes des providers"

security:
  - bearerAuth: []

paths:
  /auth/register:
    post:
      operationId: register
      tags: [Auth]
      summary: Créer un compte (envoie un OTP par SMS)
      description: |
        Anti-énumération : si l'e-mail ou le téléphone existe déjà, la réponse est identique mais
        aucun code n'est envoyé et le challenge renvoyé est inutilisable.
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/RegisterRequest' }
      responses:
        '202':
          description: Compte créé, OTP envoyé — vérification requise
          content:
            application/json:
              schema: { $ref: '#/components/schemas/OtpChallenge' }
        '422': { $ref: '#/components/responses/ValidationError' }
        '429': { $ref: '#/components/responses/TooManyRequests' }

  /auth/login:
    post:
      operationId: login
      tags: [Auth]
      summary: Connexion (renvoie un défi OTP ou MFA)
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [login, password, device]
              properties:
                login: { type: string, description: E-mail ou téléphone E.164 }
                password: { type: string, format: password }
                device: { $ref: '#/components/schemas/DeviceInfo' }
      responses:
        '202':
          description: |
            Mot de passe correct, second facteur requis : `totp` si la MFA est activée, sinon `sms`
            (ou `email` sans téléphone vérifié).
          content:
            application/json:
              schema: { $ref: '#/components/schemas/OtpChallenge' }
        '401':
          description: '`INVALID_CREDENTIALS` — même réponse que le compte existe ou non'
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
        '423':
          description: '`ACCOUNT_LOCKED` — trop d''échecs, verrouillage temporaire'
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
        '429': { $ref: '#/components/responses/TooManyRequests' }

  /auth/verify-otp:
    post:
      operationId: verifyOtp
      tags: [Auth]
      summary: Valider un OTP / code TOTP et obtenir un jeton
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [challenge_id, code]
              properties:
                challenge_id: { type: string, format: uuid }
                code: { type: string, pattern: '^[0-9]{6}$' }
      responses:
        '200':
          description: Authentifié
          content:
            application/json:
              schema: { $ref: '#/components/schemas/AuthToken' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '429': { $ref: '#/components/responses/TooManyRequests' }

  /auth/logout:
    post:
      operationId: logout
      tags: [Auth]
      summary: Révoquer le jeton courant
      responses:
        '204': { description: Déconnecté }
        '401': { $ref: '#/components/responses/Unauthorized' }
  /auth/mfa/totp:
    post:
      tags: [Auth]
      operationId: setupTotp
      summary: Démarrer l'activation de la MFA (application d'authentification)
      responses:
        '200':
          description: Secret à scanner (QR code de l'URI otpauth)
          content:
            application/json:
              schema:
                type: object
                properties:
                  secret: { type: string, description: Base32 }
                  otpauth_uri: { type: string }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '409': { $ref: '#/components/responses/Conflict' }
    delete:
      tags: [Auth]
      operationId: disableTotp
      summary: Désactiver la MFA (interdit au personnel)
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/TotpCode' }
      responses:
        '204': { description: MFA désactivée }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '422': { $ref: '#/components/responses/ValidationError' }

  /auth/mfa/totp/confirm:
    post:
      tags: [Auth]
      operationId: confirmTotp
      summary: Confirmer l'activation avec un premier code
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/TotpCode' }
      responses:
        '204': { description: MFA activée }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '409': { $ref: '#/components/responses/Conflict' }
        '422': { $ref: '#/components/responses/ValidationError' }

  /auth/device/key:
    post:
      tags: [Auth]
      operationId: registerDeviceKey
      summary: Enregistrer la clé publique biométrique de l'appareil courant
      description: Clé EC P-256 (recommandée) ou RSA ≥ 2048, au format PEM, générée dans le Secure Enclave / Keystore.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [public_key]
              properties:
                public_key: { type: string }
      responses:
        '204': { description: Clé enregistrée }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '422': { $ref: '#/components/responses/ValidationError' }

  /auth/device/challenge:
    post:
      tags: [Auth]
      operationId: deviceChallenge
      summary: Obtenir un challenge à signer avec la clé biométrique (usage unique, 2 min)
      responses:
        '200':
          description: Challenge
          content:
            application/json:
              schema:
                type: object
                properties:
                  challenge_id: { type: string, format: uuid }
                  nonce: { type: string, description: Base64 — à signer en ECDSA/RSA SHA-256 }
                  expires_at: { type: string, format: date-time }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '409': { $ref: '#/components/responses/Conflict' }

  /auth/pin:
    put:
      operationId: setPin
      tags: [Auth]
      summary: Définir ou changer le PIN de transaction
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [pin]
              properties:
                current_pin: { type: string, pattern: '^[0-9]{6}$' }
                pin: { type: string, pattern: '^[0-9]{6}$' }
      responses:
        '204': { description: PIN enregistré }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '422':
          description: PIN trivial (suite, chiffres répétés) ou PIN actuel manquant
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
        '423':
          description: '`PIN_LOCKED` — trop d''erreurs sur le PIN actuel'
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }

  /profile:
    get:
      operationId: getProfile
      tags: [Profile]
      summary: Profil de l'utilisateur connecté
      responses:
        '200':
          description: Profil
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Profile' }
        '401': { $ref: '#/components/responses/Unauthorized' }

  /catalog/funding-providers:
    get:
      operationId: listFundingProviders
      tags: [Catalog]
      summary: Portefeuilles Mobile Money utilisables pour payer (MTN MoMo, Airtel Money au Congo)
      responses:
        '200':
          description: Liste
          content:
            application/json:
              schema:
                type: object
                properties:
                  data: { type: array, items: { $ref: '#/components/schemas/ProviderSummary' } }

  /catalog/networks:
    get:
      operationId: listNetworks
      tags: [Catalog]
      summary: Réseaux de transfert actifs et leurs destinations
      responses:
        '200':
          description: Liste
          content:
            application/json:
              schema:
                type: object
                properties:
                  data: { type: array, items: { $ref: '#/components/schemas/Network' } }

  /catalog/networks/{network}/fields:
    get:
      operationId: networkFields
      tags: [Catalog]
      summary: Informations bénéficiaire exigées par le réseau pour un corridor
      description: En simulation, les champs portent `source = SIMULATION` (exigences réelles NOT CONFIRMED).
      parameters:
        - { name: network, in: path, required: true, schema: { $ref: '#/components/schemas/ProviderCode' } }
        - { name: country, in: query, required: true, schema: { $ref: '#/components/schemas/CountryCode' } }
        - { name: payout_method, in: query, required: true, schema: { $ref: '#/components/schemas/PayoutMethod' } }
      responses:
        '200':
          description: Champs
          content:
            application/json:
              schema:
                type: object
                properties:
                  data: { type: array, items: { $ref: '#/components/schemas/FieldSpec' } }

  /catalog/simulation-scenarios:
    get:
      operationId: listSimulationScenarios
      tags: [Catalog]
      summary: Scénarios de démonstration (vide hors environnement simulé)
      responses:
        '200':
          description: Scénarios
          content:
            application/json:
              schema:
                type: object
                properties:
                  enabled: { type: boolean }
                  data:
                    type: array
                    items:
                      type: object
                      properties:
                        code: { $ref: '#/components/schemas/SimulationScenario' }
                        label: { type: string }

  /transfers/quote:
    post:
      operationId: createQuote
      tags: [Transfers]
      summary: Devis (frais détaillés, taux, montant reçu, expiration)
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/QuoteRequest' }
      responses:
        '201':
          description: Devis
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Quote' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '422': { $ref: '#/components/responses/ValidationError' }
        '503': { description: "Connecteur indisponible (PROVIDER_UNAVAILABLE) — par ex. production désactivée ou connecteur officiel absent" }

  /transfers:
    get:
      operationId: listTransfers
      tags: [Transfers]
      summary: Historique (filtres état / recherche par référence ou bénéficiaire)
      parameters:
        - { name: state, in: query, schema: { type: string, enum: [in_progress, completed, all] } }
        - { name: q, in: query, schema: { type: string } }
        - { name: page, in: query, schema: { type: integer } }
      responses:
        '200':
          description: Page de transferts
          content:
            application/json:
              schema:
                type: object
                properties:
                  data: { type: array, items: { $ref: '#/components/schemas/Transfer' } }
                  meta: { type: object }
    post:
      operationId: createTransfer
      tags: [Transfers]
      summary: Confirmer le devis (PIN Cashop) et demander le débit Mobile Money
      description: |
        Le client valide le débit **sur son téléphone** auprès de son opérateur : Cashop ne demande jamais
        le PIN Mobile Money. Le transfert international n'est soumis au réseau qu'**après** confirmation du
        paiement. Un rejeu avec la même `Idempotency-Key` renvoie le même transfert (200) sans nouveau débit.
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/CreateTransferRequest' }
      responses:
        '201':
          description: Transfert créé, débit demandé
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Transfer' }
        '200': { description: Rejeu idempotent }
        '401': { description: PIN Cashop invalide (PIN_INVALID) }
        '409': { $ref: '#/components/responses/Conflict' }
        '422': { $ref: '#/components/responses/ValidationError' }

  /transfers/{id}:
    get:
      operationId: getTransfer
      tags: [Transfers]
      summary: Détail, statut et chronologie
      parameters:
        - $ref: '#/components/parameters/TransferId'
      responses:
        '200':
          description: Transfert
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Transfer' }
        '404': { $ref: '#/components/responses/NotFound' }

  /transfers/{id}/refresh:
    post:
      operationId: refreshTransfer
      tags: [Transfers]
      summary: Relire le statut auprès des prestataires et faire avancer le transfert
      parameters:
        - $ref: '#/components/parameters/TransferId'
      responses:
        '200':
          description: Transfert à jour
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Transfer' }
        '404': { $ref: '#/components/responses/NotFound' }

  /transfers/{id}/receipt:
    get:
      operationId: getReceipts
      tags: [Transfers]
      summary: Reçus émis (transfert livré et/ou remboursement)
      parameters:
        - $ref: '#/components/parameters/TransferId'
      responses:
        '200':
          description: Reçus
          content:
            application/json:
              schema:
                type: object
                properties:
                  data: { type: array, items: { $ref: '#/components/schemas/Receipt' } }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { description: Aucun reçu tant que le transfert n'est ni livré ni remboursé (RECEIPT_NOT_AVAILABLE) }

  /beneficiaries:
    get:
      operationId: listBeneficiaries
      tags: [Beneficiaries]
      summary: Bénéficiaires enregistrés
      responses:
        '200':
          description: Liste
          content:
            application/json:
              schema:
                type: object
                properties:
                  data: { type: array, items: { $ref: '#/components/schemas/Beneficiary' } }
    post:
      operationId: createBeneficiary
      tags: [Beneficiaries]
      summary: Ajouter un bénéficiaire (un doublon renvoie l'existant, 200)
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/BeneficiaryInput' }
      responses:
        '201':
          description: Créé
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Beneficiary' }
        '200': { description: Doublon — bénéficiaire existant }
        '422': { $ref: '#/components/responses/ValidationError' }

  /beneficiaries/{id}:
    parameters:
      - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
    get:
      operationId: getBeneficiary
      tags: [Beneficiaries]
      summary: Détail
      responses:
        '200':
          description: Bénéficiaire
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Beneficiary' }
        '404': { $ref: '#/components/responses/NotFound' }
    put:
      operationId: updateBeneficiary
      tags: [Beneficiaries]
      summary: Modifier
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/BeneficiaryInput' }
      responses:
        '200':
          description: Bénéficiaire
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Beneficiary' }
        '404': { $ref: '#/components/responses/NotFound' }
    delete:
      operationId: deleteBeneficiary
      tags: [Beneficiaries]
      summary: Supprimer (suppression logique)
      responses:
        '204': { description: Supprimé }
        '404': { $ref: '#/components/responses/NotFound' }

  /kyc:
    get:
      operationId: getKyc
      tags: [KYC]
      summary: Statut KYC et prochaines étapes
      responses:
        '200':
          description: Profil KYC
          content:
            application/json:
              schema: { $ref: '#/components/schemas/KycProfile' }
        '401': { $ref: '#/components/responses/Unauthorized' }
  /kyc/documents:
    post:
      operationId: uploadKycDocument
      tags: [KYC]
      summary: Envoyer un document KYC
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required: [type, file]
              properties:
                type: { type: string, enum: [NATIONAL_ID, PASSPORT, DRIVER_LICENSE, PROOF_OF_ADDRESS, SELFIE] }
                side: { type: string, enum: [FRONT, BACK] }
                file: { type: string, format: binary }
      responses:
        '201': { description: Document reçu }
        '413': { description: Fichier trop volumineux }

  /providers:
    get:
      operationId: listProviders
      tags: [Providers]
      summary: Providers actifs (informations publiques uniquement)
      responses:
        '200':
          description: Providers
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: array
                    items: { $ref: '#/components/schemas/ProviderSummary' }
        '401': { $ref: '#/components/responses/Unauthorized' }
  /providers/{provider}/capabilities:
    get:
      operationId: getProviderCapabilities
      tags: [Providers]
      summary: Capacités d'un provider (pays, devises, méthodes, opérations)
      parameters:
        - name: provider
          in: path
          required: true
          schema: { $ref: '#/components/schemas/ProviderCode' }
      responses:
        '200':
          description: Capacités
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ProviderCapabilities' }
        '404': { $ref: '#/components/responses/NotFound' }

  /webhooks/{provider}:
    post:
      operationId: receiveWebhook
      tags: [Webhooks]
      summary: Réception des notifications providers
      description: |
        Authentifié par le mécanisme du provider (signature, jeton, liste d'IP) — voir SECURITY.md §6.
        Le payload est stocké, la réponse est immédiate, le traitement est asynchrone et idempotent.
        Le format du corps dépend du provider : **NOT CONFIRMED** pour les providers réels.
      security: []
      parameters:
        - name: provider
          in: path
          required: true
          schema: { $ref: '#/components/schemas/ProviderCode' }
      requestBody:
        required: true
        content:
          application/json:
            schema: { type: object, additionalProperties: true }
      responses:
        '200':
          description: "Reçu (`status: received`) ou doublon déjà traité (`status: duplicate`)"
          content:
            application/json:
              schema:
                type: object
                properties:
                  status: { type: string, enum: [received, duplicate] }
                  event_id: { type: string, format: uuid }
        '401': { description: Signature ou jeton invalide }

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      description: |
        Jeton Sanctum lié à un appareil (portée `customer` ou `staff`, durée limitée).
        Les apps web et admin ne l'exposent jamais au navigateur : leur BFF le conserve côté serveur.

  parameters:
    IdempotencyKey:
      name: Idempotency-Key
      in: header
      required: true
      description: Identifiant unique de l'intention (UUID recommandé), 8 à 100 caractères.
      schema: { type: string, minLength: 8, maxLength: 100 }
    TransferId:
      name: id
      in: path
      required: true
      schema: { type: string, format: uuid }
    Cursor:
      name: cursor
      in: query
      schema: { type: string }
    PerPage:
      name: per_page
      in: query
      schema: { type: integer, minimum: 1, maximum: 100, default: 20 }

  responses:
    ValidationError:
      description: Données invalides
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }
    Unauthorized:
      description: Non authentifié
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }
    Forbidden:
      description: Interdit (KYC insuffisant, risque, permission)
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }
    NotFound:
      description: Introuvable
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }
    Conflict:
      description: Conflit (clé d'idempotence, statut incompatible, quote expirée)
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }
    TooManyRequests:
      description: Trop de requêtes
      headers:
        Retry-After: { schema: { type: integer } }
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }

  schemas:
    Error:
      type: object
      required: [code, message]
      properties:
        code:
          type: string
          examples: [VALIDATION_ERROR, UNAUTHENTICATED, INVALID_CREDENTIALS, ACCOUNT_LOCKED, INVALID_OTP, PIN_INVALID, PIN_LOCKED, MFA_REQUIRED, STAFF_ONLY, TOO_MANY_REQUESTS, KYC_REQUIRED, RISK_REVIEW, LIMIT_EXCEEDED, LIMITS_NOT_CONFIGURED, CORRIDOR_UNAVAILABLE, ENVIRONMENT_MISMATCH, QUOTE_EXPIRED, RECEIPT_NOT_AVAILABLE, INVALID_WEBHOOK, IDEMPOTENCY_CONFLICT, REQUEST_IN_PROGRESS, PROVIDER_UNAVAILABLE]
        message: { type: string }
        errors:
          type: object
          additionalProperties:
            type: array
            items: { type: string }
        correlation_id: { type: string }

    CurrencyCode:
      type: string
      enum: [XAF, XOF, EUR, USD, GBP]
    CountryCode:
      type: string
      pattern: '^[A-Z]{2}$'
    ProviderCode:
      type: string
      enum: [visa_direct, moneygram, western_union, ria, mtn_momo, airtel_money]
    PaymentMethod:
      type: string
      enum: [card, mobile_money, bank_account]
    PayoutMethod:
      type: string
      enum: [card, mobile_money, bank_account, cash_pickup]
    Money:
      type: object
      required: [amount, currency]
      properties:
        amount: { type: integer, description: Unités mineures }
        currency: { $ref: '#/components/schemas/CurrencyCode' }

    DeviceInfo:
      type: object
      required: [device_id, platform]
      properties:
        device_id: { type: string }
        platform: { type: string, enum: [ios, android, web] }
        name: { type: string }
    RegisterRequest:
      type: object
      required: [email, phone, password, country, device]
      properties:
        email: { type: string, format: email }
        phone: { type: string, pattern: '^\+[1-9][0-9]{7,14}$' }
        password: { type: string, format: password, minLength: 10 }
        first_name: { type: string }
        last_name: { type: string }
        country: { $ref: '#/components/schemas/CountryCode' }
        device: { $ref: '#/components/schemas/DeviceInfo' }
    TotpCode:
      type: object
      required: [code]
      properties:
        code: { type: string, pattern: '^[0-9]{6}$' }
    OtpChallenge:
      type: object
      properties:
        challenge_id: { type: string, format: uuid }
        channel: { type: string, enum: [sms, email, totp] }
        destination_hint: { type: string, examples: ['+237 6•• ••• •42'] }
        expires_at: { type: string, format: date-time }
    AuthToken:
      type: object
      properties:
        token: { type: string }
        token_type: { type: string, const: Bearer }
        expires_at: { type: string, format: date-time }
        user: { $ref: '#/components/schemas/Profile' }

    Profile:
      type: object
      properties:
        id: { type: string, format: uuid }
        email: { type: string }
        phone: { type: string }
        first_name: { type: string }
        last_name: { type: string }
        country: { $ref: '#/components/schemas/CountryCode' }
        email_verified: { type: boolean }
        phone_verified: { type: boolean }
        kyc_level: { type: string, examples: [LEVEL_1] }
        kyc_status: { $ref: '#/components/schemas/KycStatus' }
        mfa_enabled: { type: boolean }
        pin_set: { type: boolean }

    SimulationScenario:
      type: string
      enum: [SUCCESS, PAYMENT_REFUSED, PAYMENT_TIMEOUT, PAYMENT_UNKNOWN_RESPONSE, TRANSFER_FAILED, TRANSFER_PENDING, TRANSFER_TIMEOUT]
    Network:
      type: object
      properties:
        code: { $ref: '#/components/schemas/ProviderCode' }
        name: { type: string }
        environment: { type: string, enum: [mock, sandbox, production] }
        is_simulation: { type: boolean }
        destinations:
          type: array
          items:
            type: object
            properties:
              country: { $ref: '#/components/schemas/CountryCode' }
              name: { type: string }
              currency: { $ref: '#/components/schemas/CurrencyCode' }
              payout_methods:
                type: array
                items:
                  type: object
                  properties:
                    code: { $ref: '#/components/schemas/PayoutMethod' }
                    label: { type: string }
    FieldSpec:
      type: object
      properties:
        name: { type: string }
        label: { type: string }
        required: { type: boolean }
        source: { type: string, enum: [SIMULATION, PROVIDER] }
    QuoteRequest:
      type: object
      required: [network, funding_provider, destination_country, payout_method, send_amount]
      properties:
        network: { $ref: '#/components/schemas/ProviderCode' }
        funding_provider: { type: string, enum: [mtn_momo, airtel_money] }
        destination_country: { $ref: '#/components/schemas/CountryCode' }
        payout_method: { $ref: '#/components/schemas/PayoutMethod' }
        send_amount: { type: integer, minimum: 1000, description: Montant envoyé en XAF }
    FeeLine:
      type: object
      properties:
        component: { type: string, enum: [PROVIDER, FIXED, PERCENTAGE] }
        label: { type: string }
        amount: { type: integer }
    Quote:
      type: object
      properties:
        id: { type: string, format: uuid }
        network: { type: object, properties: { code: { type: string }, name: { type: string } } }
        funding_provider: { type: object, properties: { code: { type: string }, name: { type: string } } }
        environment: { type: string }
        is_simulated: { type: boolean }
        simulation_notice: { type: [string, 'null'] }
        send: { $ref: '#/components/schemas/Money' }
        fees: { type: array, items: { $ref: '#/components/schemas/FeeLine' } }
        total_fees: { $ref: '#/components/schemas/Money' }
        total_debit: { $ref: '#/components/schemas/Money' }
        receive: { $ref: '#/components/schemas/Money' }
        fx_rate: { type: string }
        fx_rate_source: { type: string }
        destination_country: { $ref: '#/components/schemas/CountryCode' }
        payout_method: { $ref: '#/components/schemas/PayoutMethod' }
        expires_at: { type: string, format: date-time }
    CreateTransferRequest:
      type: object
      required: [quote_id, beneficiary_id, funding_msisdn, pin]
      properties:
        quote_id: { type: string, format: uuid }
        beneficiary_id: { type: string, format: uuid }
        funding_msisdn: { type: string, pattern: '^\+242[0-9]{9}$', description: Numéro Mobile Money débité }
        pin: { type: string, pattern: '^[0-9]{6}$', description: PIN de transaction **Cashop** (jamais le PIN Mobile Money) }
        purpose: { type: string }
        note: { type: string }
        simulation_scenario: { $ref: '#/components/schemas/SimulationScenario' }
    TransferStatus:
      type: string
      description: Voir docs/TRANSFER-STATES.md
      enum: [INITIATED, QUOTE_PENDING, QUOTE_CONFIRMED, PAYMENT_PENDING, PAYMENT_CONFIRMED, TRANSFER_PENDING, TRANSFER_CONFIRMED, TRANSFER_AVAILABLE_FOR_PICKUP, PAYOUT_PENDING, PAYOUT_CONFIRMED, CANCEL_PENDING, REFUND_PENDING, REFUNDED, FAILED, CANCELLED, REQUIRES_RECONCILIATION]
    Transfer:
      type: object
      properties:
        id: { type: string, format: uuid }
        status: { $ref: '#/components/schemas/TransferStatus' }
        status_label: { type: string }
        is_terminal: { type: boolean }
        is_delivered: { type: boolean }
        environment: { type: string }
        is_simulation: { type: boolean }
        simulation_notice: { type: [string, 'null'] }
        network: { type: object }
        funding:
          type: object
          properties:
            provider: { type: object }
            msisdn_masked: { type: string }
            payment_status: { type: [string, 'null'], enum: [PENDING, CONFIRMED, FAILED, UNKNOWN, null] }
            payment_reference: { type: [string, 'null'] }
        beneficiary: { type: object }
        send: { $ref: '#/components/schemas/Money' }
        total_fees: { $ref: '#/components/schemas/Money' }
        total_debit: { $ref: '#/components/schemas/Money' }
        receive: { $ref: '#/components/schemas/Money' }
        fx_rate: { type: string }
        payout_method: { $ref: '#/components/schemas/PayoutMethod' }
        destination_country: { $ref: '#/components/schemas/CountryCode' }
        external_reference: { type: string, description: Référence Cashop CSH-XXXX-XXXX }
        provider_reference: { type: [string, 'null'], description: "En simulation, préfixe SIM- : jamais une référence réseau valide" }
        pickup_code: { type: [string, 'null'] }
        failure: { type: [object, 'null'] }
        refund: { type: [object, 'null'] }
        receipts: { type: array, items: { type: object } }
        timeline: { type: array, items: { $ref: '#/components/schemas/TransferEvent' } }
        created_at: { type: string, format: date-time }
        updated_at: { type: string, format: date-time }
    TransferEvent:
      type: object
      properties:
        from: { type: [string, 'null'] }
        to: { $ref: '#/components/schemas/TransferStatus' }
        label: { type: string }
        source: { type: string }
        at: { type: string, format: date-time }
    Receipt:
      type: object
      properties:
        number: { type: string }
        kind: { type: string, enum: [TRANSFER, REFUND] }
        is_simulation: { type: boolean }
        content: { type: object }
        issued_at: { type: string, format: date-time }
    BeneficiaryInput:
      type: object
      required: [first_name, last_name, country]
      properties:
        first_name: { type: string }
        last_name: { type: string }
        country: { $ref: '#/components/schemas/CountryCode' }
        phone: { type: string, pattern: '^\+[1-9][0-9]{7,14}$' }
        city: { type: string }
        relationship: { type: string }
        details: { type: object, additionalProperties: { type: string } }
    Beneficiary:
      allOf:
        - $ref: '#/components/schemas/BeneficiaryInput'
        - type: object
          properties:
            id: { type: string, format: uuid }
            display_name: { type: string }
            last_used_at: { type: [string, 'null'], format: date-time }

    KycStatus:
      type: string
      enum: [PENDING, IN_REVIEW, VERIFIED, REJECTED, EXPIRED]
    KycProfile:
      type: object
      properties:
        level: { type: string }
        status: { $ref: '#/components/schemas/KycStatus' }
        next_level: { type: [string, 'null'] }
        missing_requirements:
          type: array
          items: { type: string }
        limits:
          type: array
          description: Plafonds configurés (aucune valeur réglementaire par défaut)
          items:
            type: object
            properties:
              scope: { type: string, enum: [PER_TRANSACTION, DAILY, MONTHLY] }
              max: { $ref: '#/components/schemas/Money' }
              used: { $ref: '#/components/schemas/Money' }

    ProviderSummary:
      type: object
      properties:
        code: { $ref: '#/components/schemas/ProviderCode' }
        name: { type: string }
        status: { type: string, enum: [CONNECTED, DEGRADED, OFFLINE, UNKNOWN] }
        payout_methods:
          type: array
          items: { $ref: '#/components/schemas/PayoutMethod' }
    ProviderCapabilities:
      type: object
      properties:
        provider: { $ref: '#/components/schemas/ProviderCode' }
        operations:
          type: object
          additionalProperties:
            type: object
            properties:
              supported: { type: boolean }
              confirmation_status: { type: string, enum: [CONFIRMED, NOT_CONFIRMED] }
        countries:
          type: array
          items:
            type: object
            properties:
              country: { $ref: '#/components/schemas/CountryCode' }
              currencies:
                type: array
                items: { $ref: '#/components/schemas/CurrencyCode' }
              payout_methods:
                type: array
                items: { $ref: '#/components/schemas/PayoutMethod' }
