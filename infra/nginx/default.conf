# Reverse proxy de l'API Laravel (php-fpm).
server {
    listen 80;
    server_name _;
    root /var/www/html/public;
    index index.php;

    client_max_body_size 16m;
    server_tokens off;

    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "no-referrer" always;
    add_header Content-Security-Policy "default-src 'none'; frame-ancestors 'none'" always;
    # HSTS activé uniquement derrière TLS (production) :
    # add_header Strict-Transport-Security "max-age=63072000; includeSubDomains; preload" always;

    # Propagation / génération du correlation ID
    set $correlation_id $http_x_correlation_id;
    if ($correlation_id = "") { set $correlation_id $request_id; }
    add_header X-Correlation-Id $correlation_id always;

    location / {
        try_files $uri $uri/ /index.php?$query_string;
    }

    location ~ \.php$ {
        fastcgi_pass api:9000;
        fastcgi_param SCRIPT_FILENAME $realpath_root$fastcgi_script_name;
        fastcgi_param HTTP_X_CORRELATION_ID $correlation_id;
        include fastcgi_params;
        fastcgi_read_timeout 60s;
    }

    location ~ /\.(?!well-known) { deny all; }
}
